description: >-
  Eindhoven University of Technology (TU/e) is a public technical university in Eindhoven, the
  Netherlands, and one of the four institutions of the 4TU federation. It operates no public
  developer portal, publishes no institution-authored API contract, and offers no self-serve API
  keys — and this profile says so rather than padding the gap. Everything machine-readable that
  carries the TU/e name is a deployment of somebody else's software: the TU/e Research Portal and
  its Pure Web Service REST API are Elsevier Pure 5.35.x running at pure.tue.nl, the student
  mobile app at osiris.tue.nl is Caci Osiris, library discovery is OCLC WorldCat, and research
  datasets are minted through the 4TU.ResearchData Figshare consortium. What TU/e genuinely
  operates on its own domain is narrower and real: a live, fully conformant OAI-PMH 2.0 harvesting
  endpoint at pure.tue.nl/ws/oai serving seven metadata formats and the OpenAIRE CERIF 1.2 CRIS
  profile, and a SAML 2.0 identity-provider entity registered in the SURFconext federation and so
  reachable through eduGAIN. Thirty-seven OpenAPI documents previously attributed to TU/e in this
  repository were Elsevier's Pure product contract (info.title "Pure …", contact
  pure-support@elsevier.com, relative servers "/ws/api", shipped identically by nine other
  universities) and have been removed; the tenant relationships they described are recorded here
  instead. Departmental research groups publish open source across many separate GitHub
  organizations, but the university runs no single official engineering org.
