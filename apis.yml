x-coverage:
  state: none
  reason: tenant_only
  detail: >-
    TU/e publishes no institution-authored API contract and operates no developer portal. Every
    machine-readable surface found is a vendor's product running under TU/e's name: Elsevier Pure
    (research portal, Pure Web Service, OAI-PMH), Caci Osiris (student mobile), OCLC WorldCat
    (library discovery), Figshare via the 4TU.ResearchData consortium (datasets), and Microsoft
    Entra ID behind SURFconext (identity). Three of those are TU/e's own deployments and are
    recorded as tenant surfaces; the rest belong in the vendors' own repositories. The one fully
    public, keyless, verified-by-real-request surface is the OAI-PMH endpoint. Probed and NOT
    found, so the absence is measured rather than assumed: data.tue.nl, api.tue.nl,
    developer.tue.nl, opendata.tue.nl, ooapi.tue.nl, api.ooapi.tue.nl, idp.tue.nl, login.tue.nl,
    sts.tue.nl, sis.tue.nl, mytimetable.tue.nl and rooster.tue.nl all fail to resolve in DNS —
    they are not gated, they do not exist. purefaq.tue.nl, the Pure FAQ this repo previously
    carried as a Documentation pointer, now returns a deliberate TU/e "Off-site access blocked"
    page: it is VPN/campus-network-only, so it is recorded as evidence here and removed as a
    pointer. TU/e is named by SURF as a 2019 Open Onderwijs API (OOAPI) participant, but Dutch
    OOAPI endpoints are SURFconext-gated and none is publicly discoverable. github.com/TUEIndhoven
    resolves but holds zero public repositories; the departmental orgs (tue-datastewards,
    tue-robotics, tue-mdse, tue-aga, TUe-ICTLab, 3DCP-TUe) are research-group code, not an
    institutional API programme.
  checked: '2026-08-30'
